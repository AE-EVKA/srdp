# Repo-specific gitleaks rules on top of the default ruleset.
# Policy: docs/adr/0010-secret-management.md.
title = "srdp gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "srdp-test-password"
description = "The shared srdpTest123 development password"
regex = '''(?i)srdpTest123'''
keywords = ["srdptest123"]

[[rules]]
id = "srdp-yaml-secret-key"
description = "cookieSecret, clientSecret or masterkey with a literal value in YAML"
regex = '''(?i)\b(?:cookieSecret|clientSecret|masterkey)\s*:\s*["']?([^\s"'#{]+)'''
secretGroup = 1
path = '''\.ya?ml$'''
keywords = ["cookiesecret", "clientsecret", "masterkey"]
  # Placeholders and $VAR or $(VAR) references are not secrets.
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''CHANGE_ME''', '''XXXX''', ''':\s*["']?\$''']

[[rules]]
id = "srdp-tfvars-secret"
description = "A *_secret or *masterkey variable with a non-empty value in a tfvars file"
regex = '''(?i)\b\w*(?:_secret|masterkey)\s*=\s*"([^"]+)"'''
secretGroup = 1
path = '''\.tfvars(\.example)?$'''
keywords = ["_secret", "masterkey"]

# Chart values still hold dev secrets until ticket 01 PR 1b moves them to
# Secrets. PR 1b removes values.yaml here and keeps a narrow local entry.
# Docs files that name the leaked literals while describing the cleanup are
# listed one by one. Never allow a whole directory.
[[allowlists]]
description = "Known pending or documentary occurrences, one path each"
paths = [
  '''^deploy/kubernetes/srdp-chart/values\.yaml$''',
  '''^deploy/kubernetes/srdp-chart/values-local\.yaml$''',
  '''^docs/scaleway-deployment/checklist-01\.md$''',
  '''^docs/scaleway-deployment/tickets/00-secrets-out-of-git\.md$''',
  '''^docs/scaleway-deployment/tickets/01-chart-parity-and-secrets\.md$''',
]
