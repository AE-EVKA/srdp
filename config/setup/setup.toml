# Databases the srdp-setup service ensures exist on the Docker Compose stack
# (mounted at /etc/srdp/setup.toml). The Kubernetes equivalent is
# setup.databases in deploy/kubernetes/srdp-chart/values.yaml, keep them in step.
#
# Each entry with a `role` needs its password in SETUP_PASSWORDS__<ROLE>
# (set on the srdp-setup service in docker-compose.yml, sourced from .env).
# An entry without a `role` is owned by the Postgres superuser.

[[databases]]
name = "zitadel"
role = "zitadel"

[[databases]]
name = "dagster"
role = "dagster"

[[databases]]
name = "marquez"
role = "marquez"

# DuckLake connects as the superuser (DUCKLAKE_PG_USER=postgres).
[[databases]]
name = "ducklake"
