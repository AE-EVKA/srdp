name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} points at a commit not reachable from main, refusing to draft a release."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          HEADING=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | sed 's/^## //')
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" -f target_commitish=main --jq .body > notes.md

          if [ -n "$HEADING" ]; then
            ANCHOR=$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9 -]//g' | tr ' ' '-')
            {
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#$ANCHOR) for the full categorized summary of what changed."
              echo ""
              cat notes.md
            } > combined-notes.md
          else
            cp notes.md combined-notes.md
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --draft \
            --notes-file combined-notes.md
