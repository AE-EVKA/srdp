# srdp.toml: the central platform config (issue #42, ADR-0011).
#
# It describes a deployment and never holds secrets. Secret values stay in
# deploy/docker/.env (Compose) or the chart's values and Secrets (Kubernetes).
# Each consumer reads only its own table, so new tables can be added without
# touching existing consumers. Today the only table is [setup].
#
# The Kubernetes chart does not read this file. Its equivalent of [setup] is
# setup.databases in deploy/kubernetes/srdp-chart/values.yaml, keep the two in
# step until the srdp CLI renders the chart values from this file (#42).

# ---------------------------------------------------------------------------
# [setup]: read by the srdp-setup service (src/srdp/setup/), mounted at
# /etc/srdp/srdp.toml. Each database entry with a `role` needs that role's
# password in SETUP_PASSWORDS__<ROLE>, set on the srdp-setup service in
# deploy/docker/docker-compose.yml and sourced from .env. An entry without a
# `role` is owned by the Postgres superuser.
# ---------------------------------------------------------------------------
[setup]

[[setup.databases]]
name = "zitadel"
role = "zitadel"

[[setup.databases]]
name = "dagster"
role = "dagster"

[[setup.databases]]
name = "marquez"
role = "marquez"

# DuckLake connects as the superuser (DUCKLAKE_PG_USER=postgres).
[[setup.databases]]
name = "ducklake"
