{{- if .Values.marquez.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  labels:
    app: marquez
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marquez
  template:
    metadata:
      labels:
        app: marquez
    spec:
      # Kubernetes injects legacy Docker-links-style env vars for every
      # Service in the namespace, including this pod's own `marquez`
      # Service. That clobbers MARQUEZ_PORT with "tcp://<clusterIP>:5000",
      # which Marquez's own config expects as a plain integer, crashing on
      # startup. Disable it, nothing here relies on those vars.
      enableServiceLinks: false
      # The setup Job (srdp-setup) that creates the marquez role/database runs
      # as a post-install/post-upgrade hook, with no ordering guarantee against
      # this Deployment, confirmed live: marquez failed on startup
      # (DbMigration.migrateDbOrError) before self-healing via its own
      # container restart. Wait for the actual precondition (the database
      # existing) rather than rely on that restart.
      initContainers:
        # Checks the database, not the role: ensure_target (src/srdp/setup/bootstrap.py)
        # creates the role first and the database second, so database-exists is the
        # tighter precondition and implies the role already exists too.
        - name: wait-for-marquez-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 30); do
                if psql "postgresql://postgres@{{ .Values.global.postgresqlHost }}:5432/postgres" -tAc \
                  "SELECT 1 FROM pg_database WHERE datname = 'marquez'" | grep -q 1; then
                  exit 0
                fi
                echo "waiting for the marquez database to be created ($i/30)..."
                sleep 2
              done
              echo "marquez database still missing after 30 attempts, giving up." >&2
              exit 1
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: srdp-postgres
                  key: postgres-password
      containers:
        - name: marquez
          image: "{{ .Values.marquez.image.repository }}:{{ .Values.marquez.image.tag }}"
          imagePullPolicy: {{ .Values.marquez.image.pullPolicy }}
          ports:
            - containerPort: 5000
            - containerPort: 5001
          env:
            - name: MARQUEZ_CONFIG
              value: /etc/marquez/marquez.yml
            - name: POSTGRES_HOST
              value: {{ .Values.global.postgresqlHost | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: MARQUEZ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srdp-marquez
                  key: db-password
            - name: SEARCH_ENABLED
              value: "false"
          volumeMounts:
            - name: marquez-config
              mountPath: /etc/marquez
              readOnly: true
      volumes:
        - name: marquez-config
          configMap:
            name: marquez-config
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
spec:
  selector:
    app: marquez
  ports:
    - name: api
      protocol: TCP
      port: 5000
      targetPort: 5000
    - name: admin
      protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-web
  labels:
    app: marquez-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marquez-web
  template:
    metadata:
      labels:
        app: marquez-web
    spec:
      # Same reasoning as the marquez Deployment above: this pod currently
      # survives only because its own MARQUEZ_PORT happens to override the
      # injected one, don't rely on that ordering.
      enableServiceLinks: false
      containers:
        - name: marquez-web
          image: "{{ .Values.marquez.web.image.repository }}:{{ .Values.marquez.web.image.tag }}"
          imagePullPolicy: {{ .Values.marquez.web.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: MARQUEZ_HOST
              value: marquez
            - name: MARQUEZ_PORT
              value: "5000"
            - name: WEB_PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-web
spec:
  selector:
    app: marquez-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
{{- end }}
