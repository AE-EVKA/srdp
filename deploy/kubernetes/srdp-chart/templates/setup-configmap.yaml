# The [setup] table of srdp.toml for the srdp-setup Job, mounted at
# /etc/srdp/srdp.toml. Same shape as the repo-root srdp.toml that Compose mounts.
# A regular resource (no hook annotation), so it exists and is up to date by
# the time the post-install/post-upgrade Job reads it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srdp-setup-config
data:
  srdp.toml: |
{{ toToml (dict "setup" (dict "databases" .Values.setup.databases)) | indent 4 }}
