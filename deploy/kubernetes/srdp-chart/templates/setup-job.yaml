# Idempotent database/role bootstrap, the only mechanism creating the
# databases in setup.databases, on a fresh install and an existing volume
# alike. As a hook it has no ordering guarantee against the chart's regular
# Deployments, so each consumer waits for its own database with a
# wait-for-*-db init container. See src/srdp/setup/bootstrap.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: srdp-setup
  annotations:
    # post-install/post-upgrade: this Job needs to connect to Postgres, which
    # doesn't exist yet during pre-install hooks, those run before the
    # chart's core resources are created at all. restartPolicy: OnFailure
    # below handles the remaining gap between "resource created" and
    # "Postgres actually accepting connections".
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: srdp-setup
          image: {{ include "srdp.image" (list . .Values.setup.image) }}
          imagePullPolicy: {{ .Values.setup.image.pullPolicy }}
          env:
            - name: SETUP_PG_HOST
              value: {{ .Values.global.postgresqlHost | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srdp-postgres
                  key: postgres-password
            # One SETUP_PASSWORDS__<ROLE> per enabled role in setup.databases.
            # The Job fails before touching Postgres if one is missing.
            # Same Secret keys the consumers read, otherwise the Job resets a
            # role to a password its application does not know.
            - name: SETUP_PASSWORDS__DAGSTER
              valueFrom:
                secretKeyRef:
                  name: srdp-dagster-postgresql
                  key: postgresql-password
            - name: SETUP_PASSWORDS__MARQUEZ
              valueFrom:
                secretKeyRef:
                  name: srdp-marquez
                  key: db-password
            {{- if .Values.garage.enabled }}
            # The optional Garage step (src/srdp/setup/garage.py), only with
            # the bundled Garage. It imports the role Secrets the DuckLake
            # consumers read, so Garage accepts exactly the keys they get.
            - name: GARAGE_ADMIN_URL
              value: "http://garage:3903"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: srdp-garage
                  key: admin-token
            - name: GARAGE_BUCKET
              value: {{ required "ducklakeStorage.s3.bucket" .Values.ducklakeStorage.s3.bucket | quote }}
            - name: GARAGE_WRITER_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-writer
                  key: DUCKLAKE_S3_KEY_ID
            - name: GARAGE_WRITER_SECRET
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-writer
                  key: DUCKLAKE_S3_SECRET
            - name: GARAGE_READER_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-reader
                  key: DUCKLAKE_S3_KEY_ID
            - name: GARAGE_READER_SECRET
              valueFrom:
                secretKeyRef:
                  name: srdp-ducklake-s3-reader
                  key: DUCKLAKE_S3_SECRET
            {{- end }}
          volumeMounts:
            - name: setup-config
              mountPath: /etc/srdp
              readOnly: true
      volumes:
        - name: setup-config
          configMap:
            name: srdp-setup-config
