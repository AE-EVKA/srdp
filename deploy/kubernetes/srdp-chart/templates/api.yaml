{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- include "srdp.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "srdp.waitForDucklakeDb" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "srdp.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "srdp.ducklakeEnv" . | nindent 12 }}
            - name: DAGSTER_GRAPHQL_URL
              value: "http://{{ .Release.Name }}-dagster-webserver.{{ .Release.Namespace }}.svc.cluster.local:80/graphql"
          volumeMounts:
            {{- include "srdp.ducklakeVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "srdp.ducklakeVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
{{- end }}
