# Global settings
global:
  domain: "srdp.localhost"
  # Referenced by templates that connect to Postgres directly (marquez.yaml,
  # api.yaml, duckdb-ui.yaml, _helpers.tpl's wait-for-ducklake-db), since the
  # zitadel-db subchart's fullnameOverride differs between a single-instance
  # local install and a replicated production one (see values-prod.example.yaml).
  postgresqlHost: "db-postgresql"
  # Registry prefix for every image this repo builds (templates/_helpers.tpl
  # srdp.image). The one exception is the Dagster code location image under
  # dagster.dagster-user-deployments.deployments, a subchart value the chart
  # cannot template: keep its repository on the same registry.
  srdpRegistry: "rg.nl-ams.scw.cloud/srdp-registry"
  # Pod-level pull secrets for those images, e.g. [{name: registry-key}].
  imagePullSecrets: []

# Credentials: none live in this file. Every password and key comes from a
# Secret with a fixed name, created outside the chart (External Secrets in the
# cloud, templates/local-secrets.yaml in kind):
#   srdp-postgres            postgres-password, password (zitadel user),
#                            replication-password (replication only)
#   srdp-zitadel             masterkey, config-yaml
#   srdp-oauth2-proxy        client-id, client-secret, cookie-secret
#   srdp-dagster-postgresql  postgresql-password
#   srdp-marquez             db-password
#   srdp-ducklake-s3-writer  DUCKLAKE_S3_KEY_ID, DUCKLAKE_S3_SECRET
#   srdp-ducklake-s3-reader  DUCKLAKE_S3_KEY_ID, DUCKLAKE_S3_SECRET
#                            (both only with ducklakeStorage.backend: s3)
#   srdp-garage              rpc-secret, admin-token (only with garage.enabled)
localSecrets:
  enabled: false

# Traefik
traefik:
  enabled: true
  service:
    spec: {}
  # clusterIP is intentionally not pinned here: it must fall inside the
  # cluster's actual service CIDR, which varies by cluster (kind/Docker
  # Desktop default to 10.96.0.0/12, k3s to 10.43.0.0/16, ...). Kubernetes
  # assigns one dynamically; `just local-deploy` reads it back and feeds it
  # into oauth2-proxy.hostAliases below in a second pass.
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443

# Local PostgreSQL
zitadel-db:
  enabled: true
  fullnameOverride: "db-postgresql"
  auth:
    database: zitadel
    username: zitadel
    existingSecret: srdp-postgres
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  image:
    repository: bitnami/postgresql
  metrics:
    image:
      repository: bitnami/postgres-exporter
  # No primary.initdb.scripts: the srdp-setup Job (setup.databases below)
  # creates every database except zitadel's, on fresh and existing volumes.
  primary:
    # Bitnami's default resourcesPreset ("nano", 192Mi limit) gets the
    # primary OOMKilled once four databases and their clients connect.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    persistence:
      enabled: true
      size: 4Gi
  volumePermissions:
    enabled: true
    image:
      repository: bitnami/os-shell
  tls:
    enabled: true
    certificatesSecret: postgres-cert
    certFilename: "tls.crt"
    certKeyFilename: "tls.key"
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 8Gi
        resourcePolicy: "keep"

# Zitadel auth service
zitadel:
  enabled: true
  zitadel:
    # masterkey (32 characters) and config-yaml, which holds the database
    # passwords and the first admin's password, merged with configmapConfig.
    masterkeySecretName: srdp-zitadel
    configSecretName: srdp-zitadel
    configSecretKey: config-yaml
    configmapConfig:
      ExternalDomain: auth.srdp.localhost
      ExternalPort: 443
      TLS:
        Enabled: false
      FirstInstance:
        Org:
          Human:
            PasswordChangeRequired: false
      Database:
        Postgres:
          Host: db-postgresql
          Port: 5432
          Database: zitadel
          User:
            Username: zitadel
            SSL:
              Mode: verify-full
          Admin:
            Username: postgres
            SSL:
              Mode: verify-full
    dbSslCaCrtSecret: postgres-cert
    dbSslAdminCrtSecret: postgres-cert
    dbSslUserCrtSecret: zitadel-cert
  image:
    tag: "v4.11.1"

  ingress:
    enabled: false

  login:
    enabled: true
    ingress:
      enabled: false
    image:
      tag: "v4.11.1"

  initJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "-5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

  setupJob:
    annotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "5"
      "helm.sh/hook-delete-policy": before-hook-creation
    activeDeadlineSeconds: 900
    initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at db-postgresql:5432..."
            until nc -z -v -w 2 db-postgresql 5432; do
              echo "Waiting for DB..."
              sleep 2;
            done
            echo "PostgreSQL is up!"

# O-Auth2 Proxy
oauth2-proxy:
  enabled: true
  config:
    # client-id, client-secret and cookie-secret (32 characters).
    existingSecret: srdp-oauth2-proxy

  service:
    portNumber: 80

  extraArgs:
    skip-provider-button: "true"
    http-address: "0.0.0.0:4180"
    cookie-secure: "false"
    cookie-domain: ".srdp.localhost"
    whitelist-domain: ".srdp.localhost"
    cookie-samesite: "lax"
    cookie-expire: "168h"
    provider: "oidc"
    provider-display-name: "ZITADEL"
    oidc-issuer-url: "https://auth.srdp.localhost"
    insecure-oidc-skip-issuer-verification: "true"
    ssl-insecure-skip-verify: "true"
    email-domain: "*"
    upstream: "file:///dev/null"
    reverse-proxy: "true"

  customRequestHeaders:
    - "Host:auth.srdp.localhost"
    - "X-Forwarded-Proto:https"

  # ip is a placeholder, overwritten by `just local-deploy`'s second pass
  # once Traefik's actual (dynamically-assigned) ClusterIP is known. It must
  # be syntactically valid but is never meant to resolve anything itself,
  # see the comment on traefik.service.spec above.
  hostAliases:
    - ip: "127.0.0.1"
      hostnames:
        - "auth.srdp.localhost"

# Dagster orchestration
dagster:
  enabled: true
  # Deploys an additional webserver in --read-only mode; the exposed ingress
  # routes to it and the read-write webserver stays cluster-internal for
  # operators (port-forward). Dagster OSS has no per-user authorization, so
  # an exposed read-write UI would bypass the writer role (see ADR-0005).
  # The password comes from srdp-dagster-postgresql (key postgresql-password),
  # for the webserver, daemon, code location and run pods alike.
  global:
    postgresqlSecretName: srdp-dagster-postgresql
  generatePostgresqlPasswordSecret: false
  dagsterWebserver:
    enableReadOnly: true
    extraPrependedInitContainers: &wait-for-dagster-db
      # See templates/marquez.yaml's wait-for-marquez-db initContainer: same
      # gap, the srdp-setup post-install/post-upgrade hook that repairs a
      # missing dagster role/database has no ordering guarantee against this
      # Deployment. checkDbReadyInitContainer (below) only confirms Postgres
      # itself is reachable, not that this specific database exists.
      - name: wait-for-dagster-db
        image: postgres:17-alpine
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 30); do
              if psql "postgresql://postgres@db-postgresql:5432/postgres" -tAc \
                "SELECT 1 FROM pg_database WHERE datname = 'dagster'" | grep -q 1; then
                exit 0
              fi
              echo "waiting for the dagster database to be created ($i/30)..."
              sleep 2
            done
            echo "dagster database still missing after 30 attempts, giving up." >&2
            exit 1
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
  ingress:
    enabled: false
  postgresql:
    enabled: false
    postgresqlHost: db-postgresql
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
    service:
      port: 5432
  # K8sRunLauncher starts every run in its own pod, so unlike Compose two runs
  # can overlap. Whether DuckLake handles two concurrent writers safely is
  # still open, so queue runs and launch at most one at a time.
  dagsterDaemon:
    extraPrependedInitContainers: *wait-for-dagster-db
    runCoordinator:
      enabled: true
      type: QueuedRunCoordinator
      config:
        queuedRunCoordinator:
          maxConcurrentRuns: 1
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        loadInclusterConfig: true
        imagePullPolicy: IfNotPresent
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: srdp-etl
        image:
          repository: rg.nl-ams.scw.cloud/srdp-registry/srdp-etl
          tag: "v1.0"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "-m"
          - "etl.definitions"
        port: 3030
        # Same reasoning as dagsterWebserver/dagsterDaemon's wait-for-dagster-db
        # above: this deployment reads/writes ducklake directly, wait for the
        # actual database rather than assume srdp-setup already ran.
        initContainers:
          - name: wait-for-ducklake-db
            image: postgres:17-alpine
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 30); do
                  if psql "postgresql://postgres@db-postgresql:5432/postgres" -tAc \
                    "SELECT 1 FROM pg_database WHERE datname = 'ducklake'" | grep -q 1; then
                    exit 0
                  fi
                  echo "waiting for the ducklake database to be created ($i/30)..."
                  sleep 2
                done
                echo "ducklake database still missing after 30 attempts, giving up." >&2
                exit 1
            env:
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: srdp-postgres
                    key: postgres-password
        # Writer side of the shared DuckLake volume (templates/ducklake-data-pvc.yaml).
        # includeConfigInLaunchedRuns (on by default) copies env and volumes
        # into every K8sRunLauncher run pod, which is where assets materialize.
        volumes:
          - name: ducklake-data
            persistentVolumeClaim:
              claimName: ducklake-data
        volumeMounts:
          - name: ducklake-data
            mountPath: /data/ducklake
        # DUCKLAKE_STORAGE_BACKEND and the S3 settings, see ducklakeStorage.
        envConfigMaps:
          - name: srdp-ducklake-storage
        env:
          - name: DUCKLAKE_PG_HOST
            value: db-postgresql
          - name: DUCKLAKE_PG_USER
            value: postgres
          - name: DUCKLAKE_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srdp-postgres
                key: postgres-password
          - name: DUCKLAKE_PG_DB
            value: ducklake
          - name: DUCKLAKE_DATA_PATH
            value: /data/ducklake
          # The writer key, for DUCKLAKE_STORAGE_BACKEND=s3. Optional, so
          # local storage needs no such Secret. Only this code location and
          # its run pods hold it, the apps get the read-only key.
          - name: DUCKLAKE_S3_KEY_ID
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_KEY_ID
                optional: true
          - name: DUCKLAKE_S3_SECRET
            valueFrom:
              secretKeyRef:
                name: srdp-ducklake-s3-writer
                key: DUCKLAKE_S3_SECRET
                optional: true

# Marimo app
marimo:
  enabled: true
  image:
    repository: marimo
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Streamlit dashboard (projects/cbs-example/streamlit)
streamlit:
  enabled: true
  image:
    repository: streamlit
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Shared DuckLake data volume, see templates/ducklake-data-pvc.yaml
ducklakeData:
  mountPath: /data/ducklake
  size: 4Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

# Where DuckLake keeps its Parquet files, rendered into the
# srdp-ducklake-storage ConfigMap that every DuckLake consumer reads
# (templates/ducklake-storage-configmap.yaml). `local` uses the ducklake-data
# volume above. `s3` uses the bucket below: Dagster and its run pods get the
# key in the srdp-ducklake-s3-writer Secret, the apps the read-only key in
# srdp-ducklake-s3-reader. Both Secrets hold DUCKLAKE_S3_KEY_ID and
# DUCKLAKE_S3_SECRET. values-local-s3.yaml switches kind to the bundled Garage.
ducklakeStorage:
  backend: local
  s3:
    bucket: ""
    prefix: ""
    # Bare host[:port], no scheme; useSsl picks https or http.
    endpoint: ""
    urlStyle: path
    region: ""
    useSsl: true

# Garage, an S3-compatible server for testing DuckLake on S3 in kind. Not for
# production. templates/garage.yaml runs it with one node and a setup Job that
# creates the ducklakeStorage.s3 bucket and the writer and reader keys from the
# srdp-ducklake-s3-* Secrets. Its own RPC secret and admin token come from the
# srdp-garage Secret (keys rpc-secret, admin-token).
garage:
  enabled: false
  image:
    repository: dxflrs/garage
    tag: "v2.4.1"
    pullPolicy: IfNotPresent
  size: 4Gi

# Quarto app
# Disabled by default: heavy build (Pandoc/TinyTeX/Deno toolchain) for no
# current use. Flip to true to bring it back, the template stays in place.
quarto:
  enabled: false
  image:
    repository: quarto
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Setup: idempotent database/role bootstrap Job, see templates/setup-job.yaml
setup:
  image:
    repository: srdp-setup
    tag: "v1.0"
    pullPolicy: IfNotPresent
  # Rendered as the [setup] table of /etc/srdp/srdp.toml
  # (templates/setup-configmap.yaml). The Compose equivalent is the [setup]
  # table of the repo-root srdp.toml, keep them in step. Each
  # entry with a role gets its password from a SETUP_PASSWORDS__<ROLE> env var
  # on the Job; adding a role here means adding that env var there too.
  databases:
    # Owned by the zitadel-db subchart's auth.* fields instead, a second
    # source for the same role could silently diverge.
    - name: zitadel
      role: zitadel
      enabled: false
    - name: dagster
      role: dagster
    - name: marquez
      role: marquez
    # DuckLake connects as the superuser (DUCKLAKE_PG_USER=postgres).
    - name: ducklake

# SRDP API (core routes + cbs-example's income-ingest router)
api:
  enabled: true
  image:
    repository: srdp-api
    tag: "v1.0"
    pullPolicy: IfNotPresent

# DuckDB UI, reverse-proxied through Traefik (see services/duckdb-ui and
# projects/cbs-example/README.md for why it needs the internal route below)
duckdbUi:
  enabled: true
  image:
    repository: duckdb-ui
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Static hub landing page, served on the bare domain
hub:
  enabled: true
  image:
    repository: hub
    tag: "v1.0"
    pullPolicy: IfNotPresent

# Marquez (OpenLineage backend + UI); upstream images, not built by this repo
marquez:
  enabled: true
  # Database password from srdp-marquez (key db-password), shared with the
  # srdp-setup Job.
  image:
    repository: marquezproject/marquez
    tag: "latest"
    pullPolicy: IfNotPresent
  web:
    image:
      repository: marquezproject/marquez-web
      tag: "latest"
      pullPolicy: IfNotPresent
